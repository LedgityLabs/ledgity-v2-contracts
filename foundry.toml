[profile.default]
src = "src"
out = "foundry/out"
cache_path = "foundry/cache"
test = "tests"
libs = ["node_modules", "foundry/lib"]
optimizer = true
optimizer_runs = 1
evm_version = "cancun"
ffi = true # required by hedera-forking
allow_internal_expect_revert = true

[profile.default.fuzz]
runs = 250

[profile.default.invariant]
runs = 250
depth = 20

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 10000
depth = 50